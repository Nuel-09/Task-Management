{% extends "base.html" %}
{% block content %}
<section class="card">
    <div class="dashboard-header">
        <div>
            <h1>{{ app_name }}</h1>
            <p class="dashboard-subtitle">Dashboard</p>
        </div>
        <button id="logout-btn" type="button" class="btn btn-secondary btn-sm">Logout</button>
    </div>

    <div class="todo-form-section">
        <form id="todo-form">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" placeholder="What do you need to do?" required>

            <label for="description">Description</label>
            <textarea id="description" name="description" placeholder="Add optional details"></textarea>

            <button type="submit" class="btn btn-primary">Add Todo</button>
        </form>
    </div>

    <div class="filter-bar" role="group" aria-label="Filter todos">
        <button id="filter-all" type="button" class="btn btn-secondary is-active">All</button>
        <button id="filter-pending" type="button" class="btn btn-secondary">Pending</button>
        <button id="filter-completed" type="button" class="btn btn-secondary">Completed</button>
    </div>

    <ul id="todo-list"></ul>
    <p id="message"></p>
</section>

<script>
const token = localStorage.getItem("todo_token");
if (!token) {
    window.location.href = "/";
}

const todoForm = document.getElementById("todo-form");
const todoList = document.getElementById("todo-list");
const message = document.getElementById("message");
const filterButtons = {
    all: document.getElementById("filter-all"),
    pending: document.getElementById("filter-pending"),
    completed: document.getElementById("filter-completed"),
};
let currentStatusFilter = null;

function authHeaders() {
    return {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`,
    };
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
}

function setActiveFilter(status) {
    Object.entries(filterButtons).forEach(([key, button]) => {
        const isActive = (status === null && key === "all") || status === key;
        button.classList.toggle("is-active", isActive);
    });
}

function todoItemHtml(todo) {
    const toggleLabel = todo.status === "pending" ? "Mark complete" : "Mark pending";
    const toggleStatus = todo.status === "pending" ? "completed" : "pending";
    const title = escapeHtml(todo.title);
    const description = escapeHtml(todo.description || "No description");
    const status = escapeHtml(todo.status);

    return `
        <li class="todo-item">
            <div>
                <strong>${title}</strong>
                <p>${description}</p>
                <span class="status-badge ${status}">${status}</span>
            </div>
            <div class="actions">
                <button type="button" class="btn btn-secondary btn-sm" onclick="toggleTodoStatus('${todo.id}', '${toggleStatus}')">${toggleLabel}</button>
                <button type="button" class="btn btn-danger btn-sm" onclick="deleteTodo('${todo.id}')">Delete</button>
            </div>
        </li>
    `;
}

async function loadTodos(status = null) {
    currentStatusFilter = status;
    setActiveFilter(status);
    const endpoint = status ? `/api/todos?status=${status}` : "/api/todos";
    const response = await fetch(endpoint, { headers: authHeaders() });
    if (!response.ok) {
        message.textContent = "Failed to load todos.";
        message.classList.remove("success");
        return;
    }
    const todos = await response.json();
    if (todos.length === 0) {
        todoList.innerHTML = '<li class="empty-state">No todos yet. Add your first task above.</li>';
        return;
    }
    todoList.innerHTML = todos.map(todoItemHtml).join("");
    message.textContent = "";
}

async function toggleTodoStatus(todoId, newStatus) {
    await fetch(`/api/todos/${todoId}/status`, {
        method: "PATCH",
        headers: authHeaders(),
        body: JSON.stringify({ status: newStatus }),
    });
    await loadTodos(currentStatusFilter);
}

async function deleteTodo(todoId) {
    await fetch(`/api/todos/${todoId}`, {
        method: "DELETE",
        headers: authHeaders(),
    });
    await loadTodos(currentStatusFilter);
}

todoForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const payload = {
        title: todoForm.title.value,
        description: todoForm.description.value || null,
    };

    const response = await fetch("/api/todos", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify(payload),
    });

    if (!response.ok) {
        message.textContent = "Could not create todo.";
        message.classList.remove("success");
        return;
    }

    todoForm.reset();
    message.textContent = "Todo added.";
    message.classList.add("success");
    await loadTodos(currentStatusFilter);
});

document.getElementById("filter-all").addEventListener("click", () => loadTodos());
document.getElementById("filter-pending").addEventListener("click", () => loadTodos("pending"));
document.getElementById("filter-completed").addEventListener("click", () => loadTodos("completed"));
document.getElementById("logout-btn").addEventListener("click", () => {
    localStorage.removeItem("todo_token");
    window.location.href = "/";
});

loadTodos();
window.toggleTodoStatus = toggleTodoStatus;
window.deleteTodo = deleteTodo;
</script>
{% endblock %}
