{% extends "base.html" %}
{% block title %}{{ app_name }} — Register{% endblock %}
{% block content %}
<section class="card auth-card">
    <header class="card-intro">
        <h1>{{ app_name }}</h1>
        <p>Create an account to manage your tasks.</p>
    </header>
    <h2>Register</h2>
    <form id="register-form">
        <label for="full_name">Full Name</label>
        <input id="full_name" name="full_name" type="text" autocomplete="name" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="password">Password</label>
        <div class="password-field">
            <input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required>
            <button
                type="button"
                class="password-toggle"
                data-password-toggle
                aria-controls="password"
                aria-label="Show password"
            >Show</button>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create Account</button>
        </div>
    </form>
    <p class="auth-links"><a href="/">Back to login</a></p>
    <p id="message"></p>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/auth.js"></script>
<script>
const registerForm = document.getElementById("register-form");
const message = document.getElementById("message");

registerForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const payload = {
        full_name: registerForm.full_name.value,
        email: registerForm.email.value,
        password: registerForm.password.value,
    };

    const response = await fetch("/api/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
    });

    const data = await response.json();
    if (!response.ok) {
        message.textContent = data.detail || "Registration failed";
        message.classList.remove("success");
        return;
    }

    message.textContent = "Account created. Redirecting to login...";
    message.classList.add("success");
    setTimeout(() => { window.location.href = "/"; }, 1000);
});
</script>
{% endblock %}
