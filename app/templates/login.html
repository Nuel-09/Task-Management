{% extends "base.html" %}
{% block title %}{{ app_name }} — Login{% endblock %}
{% block content %}
<section class="card auth-card">
    <header class="card-intro">
        <h1>{{ app_name }}</h1>
        <p>Login to your account to manage your tasks.</p>
    </header>
    <h2>Login</h2>
    <form id="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="password">Password</label>
        <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button
                type="button"
                class="password-toggle"
                data-password-toggle
                aria-controls="password"
                aria-label="Show password"
            >Show</button>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Sign In</button>
        </div>
    </form>
    <p class="auth-links"><a href="/register">Create account</a></p>
    <p id="message"></p>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/auth.js"></script>
<script>
const loginForm = document.getElementById("login-form");
const message = document.getElementById("message");

loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const payload = {
        email: loginForm.email.value,
        password: loginForm.password.value,
    };

    const response = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
    });

    const data = await response.json();
    if (!response.ok) {
        message.textContent = data.detail || "Login failed";
        message.classList.remove("success");
        return;
    }

    localStorage.setItem("todo_token", data.access_token);
    window.location.href = "/dashboard";
});
</script>
{% endblock %}
